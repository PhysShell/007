[package]
name = "o7-closure-classifier"
version = "0.1.0"
edition = "2021"
description = "Pure closure classifier: explicit observations in, deterministic closure predicate out. No network, no GitHub API, no local Git authority, no attestation — those layers live outside and above this crate."
publish = false

[lib]
name = "o7_closure_classifier"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Mirror the workspace discipline: no unsafe, no panics-by-default.
[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
