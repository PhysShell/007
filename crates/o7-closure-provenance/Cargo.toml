[package]
name = "o7-closure-provenance"
version = "0.1.0"
edition = "2021"
description = "Classifier provenance binding: a decision basis whose every input must resolve to retained evidence, a per-field retention axis, and the authority path by which an expected query digest reaches replay without passing through the store that holds the bytes."
publish = false

[lib]
name = "o7_closure_provenance"
path = "src/lib.rs"

[dev-dependencies]
# Parsing Rust with `contains()` is how E1 came to accept a `.unwrap()` that was
# a string literal inside its own filter expression. `syn` is used ONLY by
# `tests/correction_b2.rs`'s allowance audit, and only to answer two questions an
# AST answers exactly and a substring search cannot: which lints an `#[allow]`
# actually names, and whether a call site is real code rather than a comment or
# a literal. Already in the workspace lock via `async-trait`; no new source.
syn = { version = "2", features = ["full", "visit", "parsing"] }

[dependencies]
o7-closure-canonical = { path = "../o7-closure-canonical" }
o7-closure-classifier = { path = "../o7-closure-classifier" }
o7-closure-matcher = { path = "../o7-closure-matcher" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
