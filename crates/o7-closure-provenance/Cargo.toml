[package]
name = "o7-closure-provenance"
version = "0.1.0"
edition = "2021"
description = "Classifier provenance binding: a decision basis whose every input must resolve to retained evidence, a per-field retention axis, and the authority path by which an expected query digest reaches replay without passing through the store that holds the bytes."
publish = false

[lib]
name = "o7_closure_provenance"
path = "src/lib.rs"

[dependencies]
o7-closure-canonical = { path = "../o7-closure-canonical" }
o7-closure-classifier = { path = "../o7-closure-classifier" }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
