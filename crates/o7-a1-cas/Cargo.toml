[package]
name = "o7-a1-cas"
version = "0.1.0"
edition = "2021"
description = "007 A1 step 2, lower layer: the owned CAS write/read boundary, the accounting session, and the FD-1.8 storage-integrity proof. Typed-slot resolution (FD-2.5) needs the §3 payload schemas and is a later slice, so nothing here is publicly claimed to be a resolved artifact."
publish = false

[lib]
name = "o7_a1_cas"
path = "src/lib.rs"

# Same discipline as o7-a1-contracts, and for the same reason: this crate is
# half of a wire contract's admission path, not a runtime. It depends on the
# contract seed and on nothing heavy.
[dependencies]
o7-a1-contracts = { path = "../o7-a1-contracts" }
thiserror = "1"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

# Test-only: the negative-space probes assert that the proof-bearing type does
# NOT implement `Serialize`, which needs the trait in scope to ask about.
[dev-dependencies]
serde = "1"
serde_json = "1"
