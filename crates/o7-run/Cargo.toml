[package]
name = "o7-run"
version = "0.1.0"
edition = "2021"
description = "007 canonical run-event protocol, pure run-state reducer, and independent replay: a green verdict means every required obligation was actually discharged, and a stored run can be re-derived byte-for-byte or fail loudly."
publish = false

[lib]
name = "o7_run"
path = "src/lib.rs"

# The reducer is a PURE function and the event protocol is a persistence-independent
# contract, so this crate deliberately depends on NOTHING heavy: no ledger, no tokio,
# no sqlite. The ledger mapping, worker integration, and CLI replay are wired in later
# crates/commits so run truth can be recomputed with only serde + a hash.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Content and event-chain digests (tamper-evident replay). Already allowed in the
# workspace deny.toml.
sha2 = "0.10"
thiserror = "1"

# Mirror the workspace-root crate's discipline: no unsafe, no panics-by-default.
[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
