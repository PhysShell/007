[package]
name = "o7d"
version = "0.1.0"
edition = "2021"
description = "007 control-plane daemon: the sole HTTP/SSE read surface over o7-ledger. Untrusted clients (Q-Deck) see only versioned transport DTOs — never a SQLite handle, a subprocess handle, or a control socket."
publish = false

[[bin]]
name = "o7d"
path = "src/main.rs"

[lib]
name = "o7d"
path = "src/lib.rs"

[dependencies]
o7-ledger = { path = "../o7-ledger", version = "0.1.0" }
tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    # AsyncReadExt/AsyncWriteExt: only tests/sse.rs's raw-socket reconnect
    # transcript uses these directly (production code never hand-writes HTTP);
    # listed on the main dependency rather than as a dev-only feature bump
    # since Cargo unifies features across one dependency graph either way.
    "io-util",
] }
# The SSE stream's poll loop is built on `stream::unfold`, not the `async-stream`
# macro crate: `futures-util` is already compiled as part of axum's own
# dependency graph (axum's extractors/response bodies are built on it), so
# depending on it here — narrowed to just the `alloc`/`std` combinators
# actually used — adds no new crate to the tree.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# R0's whole surface is bounded JSON + one-way SSE over HTTP/1 — no WebSocket
# (the brief is explicit: "WebSocket is not needed for a one-way read-only
# stream"), no multipart, no form bodies. `default-features = false` + this
# explicit list keeps the graph to what R0's own API layer exercises; static
# file serving (below, via tower-http) is a separate concern layered on top.
axum = { version = "0.7", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
] }
# `o7d serve --static-dir <dist>` is o7d's documented production role: same
# origin serves both `/api/v1/*` and the built Q-Deck shell, with unmatched
# paths (a client-side route like `/runs/abc`) falling back to `index.html`
# so the SPA's own router — not the server — decides what that path means.
# `fs` is the only feature needed for `ServeDir`/`ServeFile`.
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
# Q-Deck R1 second corrective round: proving a spawned `o7 continue`
# process is actually dead (not just slow) before ever re-spawning a
# second one for the SAME child run id. `flock` auto-releases on process
# death regardless of how the process died (clean exit, panic, SIGKILL) —
# a real liveness proof, unlike a wall-clock staleness guess. `fs` is the
# only feature needed for `nix::fcntl::Flock`.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["fs"] }

[dev-dependencies]
# Router-level HTTP tests drive the real `axum::Router` as a `tower::Service`
# via `oneshot` — real `http::Request`/`http::Response`, real routing/
# extraction/serialization, no handler called directly. `tower` and
# `http-body-util` are already compiled as part of axum's own dependency
# graph (axum is built on `tower::Service`); depending on them here adds no
# new crate to the tree, unlike a standalone HTTP client (reqwest pulls in
# a full URL/TLS stack — icu4x/idna — for a capability this test doesn't need).
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
tempfile = "3"

# Mirror the workspace discipline: no unsafe, no panics-by-default.
[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
