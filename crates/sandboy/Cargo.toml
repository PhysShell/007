[package]
name = "sandboy"
version = "0.1.0"
edition = "2021"
description = "007 external confinement backend (Sandboy): the SEPARATE, unsafe-permitted trust boundary that installs real Linux confinement (Landlock + seccomp + a monitor-owned cgroup v2) OUTSIDE the forbid-unsafe 007 crates and reports each dimension honestly. VB-0: honest fail-closed bootstrap over the frozen protocol — no kernel enforcement yet."
publish = false

[[bin]]
name = "sandboy"
path = "src/main.rs"

[features]
# INTERNAL, NON-DEFAULT. Exposes the `__cgroup-run` / `__landlock-run` / `__seccomp-run` standalone
# harness entries that the `#[ignore]`d per-mechanism acceptance tests (VB-1/2/3) drive on a real host.
# Those harnesses call the SAME production install functions VB-4 composes (no copies). The confinement
# modules are now production code, so this feature only adds the standalone drivers — never present in a
# production build.
test-harness = []
# INTERNAL, NON-DEFAULT, TEST-ONLY. Compiles the deterministic `FaultPoint` seam into the REAL VB-4
# launch state machine so the frozen confinement matrix's setup-failure oracles drive genuine stage
# failures against the real backend. A production/default/release build NEVER compiles the seam (no
# `O7_FAULT_POINT` recognition, no stage table), and a fault-enabled artifact carries a DISTINCT
# backend identity so it can never be accepted as a production backend.
fault-injection = []

[dependencies]
# The pure wire protocol shared VERBATIM with the o7-worker parent: framing, digests, policy
# reconstruction, and the report all come from here, so the backend never depends on the worker runtime.
o7-sandbox-protocol = { path = "../o7-sandbox-protocol" }
# VB-4: the confinement modules are now the PRODUCTION launch path, so their kernel dependencies are
# non-optional. `libc` supplies the target-provided Landlock/prctl/seccomp/fd syscall numbers ONLY (no
# hidden implementation) for the single audited `landlock/sys.rs` + `seccomp/sys.rs` modules. Pinned.
libc = "0.2.186"
# VB-3/VB-4: the seccomp deny filter is BUILT from a typed Rust policy and compiled to BPF by
# `seccompiler` (rust-vmm / Firecracker's, pure-Rust — no system libseccomp). Pinned EXACTLY, default
# features OFF (drops the optional serde/JSON path), so only its typed API + `libc` are pulled in.
seccompiler = { version = "=0.5.0", default-features = false }

[dev-dependencies]
# The bootstrap tests drive the backend BINARY directly over a UnixStream and craft/parse frames
# with the same pure protocol crate — no new external dependency.
o7-sandbox-protocol = { path = "../o7-sandbox-protocol" }
# Scratch dirs for the would-be-target marker. Already a workspace dev-dependency (o7-worker),
# already allowed in deny.toml.
tempfile = "3"

# This crate is the DESIGNATED external `unsafe` trust boundary (see
# docs/architecture/sandboy-backend-vb0.md, Decision 1 of sandboy-boundary.md): every OTHER 007
# crate sets `unsafe_code = "forbid"` in its own manifest, and this one is the single place kernel
# confinement syscalls (Landlock/seccomp — VB-2/VB-3) may live. It uses NONE at VB-0. The rest of
# the workspace lint discipline is kept.
[lints.rust]
# `unsafe_code` is deliberately NOT forbidden at the manifest level — this is the confinement
# boundary. Instead `main.rs` keeps `forbid(unsafe_code)` for PRODUCTION builds (feature off) and
# lifts it ONLY under `test-harness`, where VB-2's Landlock syscalls live. `kani` is registered so
# stable builds don't warn.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
# Every op inside an `unsafe fn` still needs its own `unsafe` block (there are none today, but pin it).
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
# Unsafe discipline for the VB-2 Landlock boundary: every `unsafe` block carries a `// SAFETY:`
# comment and does exactly one unsafe operation, so the audited surface stays small and reviewable.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
