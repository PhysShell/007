# 007 is now a workspace: the existing `o7` CLI stays the root package; new
# foundation crates live under `crates/`. The ledger (durable source of truth)
# is a SEPARATE crate — it must not be hidden inside the CLI crate.
# `fuzz/` is excluded so cargo-fuzz keeps managing it independently.
[workspace]
members = [
    "crates/o7-ledger",
    "crates/o7-worker",
    "crates/o7-worktree",
    "crates/o7-verifier",
    "crates/o7-run",
    "crates/o7-sandbox-protocol",
    "crates/o7-a1-protocol",
    "crates/o7-harness-policy",
    "crates/o7d",
]
exclude = ["fuzz"]
resolver = "2"

[package]
name = "o7"
version = "0.1.0"
edition = "2021"
description = "007 — personal harness: one isolated, gated agent run over a target repo"
publish = false

[[bin]]
name = "o7"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
# The canonical run-event protocol + pure reducer + independent replay:
# `o7 run` emits the event stream and takes its verdict from `reduce_all`;
# `o7 replay` re-verifies stored records (src/events.rs — the MVP stitch).
o7-run = { path = "crates/o7-run", version = "0.1.0" }
# Live-ingress projection (Q-Deck R0.7, docs/q-deck/r07-live-ingress.md):
# a plain library dependency, same as o7-run above. o7-ledger's own API is
# async; `tokio` here is purely an internal implementation detail of
# src/ledger_projector.rs's synchronous facade (current-thread runtime,
# .block_on per call) — the rest of the CLI stays exactly as synchronous
# as it is today.
o7-ledger = { path = "crates/o7-ledger", version = "0.1.0" }
# Q-Deck A0 (docs/q-deck/a0-candidate-state.md): reuses this crate's own
# `identity::CanonicalRepoId`/`git::HardenedGit::canonical_repo_id()` for
# candidate-state receipts' repository identity, rather than reinventing
# one. Its heavier materialize/store/reap machinery (built for materializing
# an already-committed revision under a strict security preflight, not
# applying an out-of-band patch) is deliberately NOT used here.
o7-worktree = { path = "crates/o7-worktree", version = "0.1.0" }
tokio = { version = "1", features = ["rt"] }
sha1 = "0.10"
sha2 = "0.10"
# `invoke.rs` only: independently re-validates a backend's structured output
# against a caller-supplied JSON Schema. Default features pull in `reqwest`
# (remote $ref resolution) -- explicitly off: a schema-validating primitive
# must not gain a network path from a dependency default, especially one
# fed an arbitrary caller-supplied schema file. `cargo deny check` run
# against this addition: one new license to allow (`borrow-or-share` is
# MIT-0, strictly more permissive than plain MIT -- added to deny.toml),
# advisories/bans/sources all clean.
jsonschema = { version = "0.47", default-features = false }

# `invoke.rs` timeout path only (unix): SIGKILL the backend's WHOLE process
# group, not just the direct child, so a descendant still holding the stdout/
# stderr pipe can't keep the reader threads (and thus the "timeout" itself)
# blocked forever. `nix::sys::signal::killpg` is used because the tree forbids
# `unsafe` (`[lints.rust] unsafe_code = "forbid"`) and nix wraps the raw
# syscall in a safe API. Unix-only by construction -- 007 runs on WSL2/Linux;
# a Windows Job Object equivalent is explicitly out of scope. `nix` is MIT
# (allowed in deny.toml); it pulls only bitflags/cfg-if/libc, all permissive.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", default-features = false, features = ["signal", "fs"] }
# Q-Deck A0 corrective round 1 (`docs/q-deck/a0-candidate-state.md`): the
# private candidate-patch temp store (`src/worktree.rs`) needs O_EXCL|
# O_NOFOLLOW-confined file creation OUTSIDE the candidate-controlled
# worktree, so a symlink a base commit's own tree contains can never redirect
# a write. Already an in-tree, `deny.toml`-allowed dependency (`o7-worktree`
# already uses it for its own no-follow confinement primitives) — reused
# here rather than hand-rolling raw libc calls or adding a new crate.
rustix = { version = "1", default-features = false, features = ["fs", "std"] }

# Lints. Curated to pass `clippy --all-targets -D warnings` clean on today's code
# (ratchet, not a blast): the broad pedantic/nursery families are deliberately
# left off — see docs/verification.md for the tracked follow-ups.
[lints.rust]
# `kani` is a cfg set by `cargo kani`; register it so stable builds don't warn.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_code = "forbid"        # no unsafe in the tree; lock that invariant in
unreachable_pub = "deny"      # a `pub` nothing can reach is a lie in the API
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
# Restriction lints that are already clean here — keep the discipline enforced.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"     # panic-on-index; the two proven-safe slices carry a justified #[allow]

[dev-dependencies]
proptest = "1"
tempfile = "3"
# tests/live_ingress_e2e.rs only: a raw connection to directly delete
# already-projected rows, simulating a sink that lost data it once
# successfully wrote — o7-ledger's own API has no delete method by design
# (append-only), so this bypasses it deliberately, from the test side only.
rusqlite = { version = "0.32", features = ["bundled"] }
# Q-Deck R0.7 process-level E2E test only (tests/live_ingress_e2e.rs): a
# dev-dependency is Cargo's own documented way to make CARGO_BIN_EXE_o7d
# available to this crate's integration tests, so the test can spawn the
# REAL compiled o7d binary as its own OS process, not call into it in-memory.
# The test itself is plain synchronous std (no async runtime needed for a
# blocking Command::spawn + std::net::TcpStream harness).
o7d = { path = "crates/o7d", version = "0.1.0" }

[profile.release]
strip = true
