name: o7-worker gate

# Independent HOSTED replay of the o7-worker re-gate matrix (fmt, clippy, workspace
# check, o7-worker tests, cargo-deny). This is an infrastructure replay, NOT an
# independent code review: it runs tests authored in this repository. Action pins are
# full-length commit SHAs (immutable); tags in comments are informational.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  worker-gate:
    name: worker gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # On a PR, test the PR HEAD (not the synthetic merge ref); on push/manual, the pushed SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record execution identity
        shell: bash
        run: |
          set -euo pipefail
          echo "tested_sha=$(git rev-parse HEAD)"
          echo "event=${GITHUB_EVENT_NAME}"
          # The repository's toolchain is the floating `stable` channel (rust-toolchain.toml),
          # NOT a pinned version — the exact resolved identity is recorded here.
          rustup show active-toolchain
          rustc -Vv
          cargo --version
          git status --short

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Workspace check
        run: cargo check --workspace --all-targets --locked

      # Explicit DEFAULT production build. `cargo check --all-targets` above compiles the test/dev
      # graph too; this fixes the claimed harness-free production graph with a real default build
      # (no test targets → no dev-dependency features activated anywhere).
      - name: Default production build
        run: cargo build --workspace --locked

      - name: o7-run tests
        run: cargo test -p o7-run --locked --no-fail-fast

      - name: o7-worker tests
        run: cargo test -p o7-worker --locked --no-fail-fast

      # Repository policy: the o7-worker `test-harness` feature may be enabled from exactly one
      # dependency edge (o7-worker's own dev-dependency self-edge). The gate structurally parses
      # every workspace manifest, pins the production feature graph, and compile-probes the default
      # o7-worker API for the absence of the test-only surface.
      - name: Harness feature policy (gate + production graph + compile probe)
        run: cargo test -p o7-harness-policy --locked --no-fail-fast

      # Explicit production-graph pin (belt-and-suspenders alongside the test above): with dev edges
      # excluded, the resolved feature graph must not activate `test-harness` anywhere.
      - name: Production feature graph is harness-free
        shell: bash
        run: |
          set -euo pipefail
          if cargo tree --workspace --locked --edges no-dev,features | grep -n 'test-harness'; then
            echo "::error::test-harness is active in the production feature graph" >&2
            exit 1
          fi
          echo "production feature graph is harness-free"

      # Production-API compile probe. A plain `cargo build` activates no dev-dependency features, so
      # o7-harness-policy links the PRODUCTION o7-worker. The default build (harness-free consumer)
      # must compile; the same references behind `probe-leak` must FAIL — proving the default API
      # has no `fake_mode` / `with_post_go_barrier`. (Build-based, not a doctest: a workspace test
      # build unifies test-harness into o7-worker and would mask the very absence being proved.)
      - name: Production API is harness-free (compile probe)
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p o7-harness-policy --locked
          if cargo build -p o7-harness-policy --locked --features probe-leak 2>probe.err; then
            cat probe.err >&2
            echo "::error::the test-only surface is reachable from a production consumer" >&2
            exit 1
          fi
          grep -q 'fake_mode' probe.err
          grep -q 'with_post_go_barrier' probe.err
          rm -f probe.err
          echo "compile probe: production API is harness-free"

  dependency-policy:
    name: dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bans, licenses, sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans licenses sources
          # Empty, so the action's default `--all-features` does not silently widen the
          # dependency graph relative to the accepted local `cargo deny check`.
          arguments: ""

  advisories:
    name: dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
          arguments: ""

  # Vertical B — the REAL kernel confinement acceptance matrix. Runs the `#[ignore]`d
  # sandbox_confinement tests (the portable worker-gate skips them, staying host-agnostic). The
  # required kernel features are asserted first: a missing Landlock ABI, seccomp, or delegated
  # cgroup v2 is an EXPLICIT job FAILURE here, never a skip or a green "unsupported". RED until the
  # real backend lands; GREEN turns the matrix green by making the backend actually enforce.
  sandbox-confinement:
    name: sandbox confinement (Vertical B)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Real CAPABILITY preflight — not a presence grep. It EXERCISES each mechanism and FAILS the
      # job (never skips) if any cannot actually be used, so a red matrix afterwards is attributable
      # to the backend, not the environment. Landlock/seccomp are driven through Python `ctypes`
      # (a CI tool), keeping all confinement syscalls OUT of the forbid-unsafe Rust tree.
      - name: Prove cgroup v2 capability (mkdir → move → kill → rmdir)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /sys/fs/cgroup/cgroup.controllers ]; then
            echo "::error::cgroup v2 is not mounted (/sys/fs/cgroup/cgroup.controllers)"; exit 1
          fi
          own=$(grep '^0::' /proc/self/cgroup | cut -d: -f3-)
          base="/sys/fs/cgroup${own}"
          child="${base}/o7-capcheck.$$"
          if ! mkdir "$child" 2>/dev/null; then
            echo "::error::cannot create a child cgroup under ${base} (no delegated subtree)"; exit 1
          fi
          # Move a disposable process in and prove membership.
          sleep 120 & victim=$!
          if ! echo "$victim" > "$child/cgroup.procs" 2>/dev/null; then
            echo "::error::cannot move a process into the delegated cgroup"; kill -9 "$victim"; rmdir "$child"; exit 1
          fi
          if ! grep -qx "$victim" "$child/cgroup.procs"; then
            echo "::error::cgroup.procs does not reflect the moved process"; kill -9 "$victim"; rmdir "$child" 2>/dev/null || true; exit 1
          fi
          # Kill the whole cgroup (cgroup.kill, ABI 5.14+) and prove it drains, then remove it. The
          # disposable child is reaped (`wait`) so its task leaves cgroup.procs and the group drains.
          if [ -e "$child/cgroup.kill" ]; then echo 1 > "$child/cgroup.kill"; else kill -9 "$victim"; fi
          wait "$victim" 2>/dev/null || true
          for _ in $(seq 1 50); do [ -s "$child/cgroup.procs" ] || break; sleep 0.1; done
          if [ -s "$child/cgroup.procs" ]; then
            echo "::error::the cgroup did not drain after kill"; kill -9 "$victim" 2>/dev/null || true; rmdir "$child" 2>/dev/null || true; exit 1
          fi
          kill -9 "$victim" 2>/dev/null || true
          if ! rmdir "$child" 2>/dev/null || [ -e "$child" ]; then
            echo "::error::cannot remove the delegated cgroup directory"; exit 1
          fi
          echo "cgroup v2 capability proven: mkdir, move, membership, kill, drain, rmdir"

      - name: Prove Landlock + seccomp capability (real ruleset + real filter)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ctypes, os, struct, sys
          libc = ctypes.CDLL(None, use_errno=True)

          # --- Landlock: query ABI >= 1, then CREATE a representative ruleset fd. ---
          NR_landlock_create_ruleset = 444
          LANDLOCK_CREATE_RULESET_VERSION = 1 << 0
          abi = libc.syscall(NR_landlock_create_ruleset, None, 0, LANDLOCK_CREATE_RULESET_VERSION)
          if abi < 1:
              print(f"::error::Landlock ABI unavailable (query returned {abi}, errno {ctypes.get_errno()})")
              sys.exit(1)
          class ruleset_attr(ctypes.Structure):
              _fields_ = [("handled_access_fs", ctypes.c_uint64)]
          # ABI-v1 filesystem access rights (bits 0..12) — a representative ruleset.
          attr = ruleset_attr(0x1fff)
          rs = libc.syscall(NR_landlock_create_ruleset, ctypes.byref(attr), 8, 0)
          if rs < 0:
              print(f"::error::cannot create a Landlock ruleset (errno {ctypes.get_errno()})")
              sys.exit(1)
          os.close(rs)
          print(f"Landlock capability proven: ABI {abi}, representative ruleset created")

          # --- seccomp: install a minimal BPF filter in a disposable child and observe a chosen
          # syscall denied with the expected errno. ---
          def child():
              PR_SET_NO_NEW_PRIVS = 38
              if libc.prctl(PR_SET_NO_NEW_PRIVS, 1, 0, 0, 0) != 0:
                  os._exit(2)
              BPF_LD, BPF_W, BPF_ABS = 0x00, 0x00, 0x20
              BPF_JMP, BPF_JEQ, BPF_K = 0x05, 0x10, 0x00
              BPF_RET = 0x06
              SECCOMP_RET_ALLOW = 0x7fff0000
              SECCOMP_RET_ERRNO = 0x00050000
              NR_getpriority = 140  # x86_64; the chosen syscall to deny
              EPERM = 1
              def stmt(code, k): return struct.pack("HBBI", code, 0, 0, k)
              def jump(code, k, jt, jf): return struct.pack("HBBI", code, jt, jf, k)
              prog = b"".join([
                  stmt(BPF_LD | BPF_W | BPF_ABS, 0),                 # A = seccomp_data.nr
                  jump(BPF_JMP | BPF_JEQ | BPF_K, NR_getpriority, 0, 1),
                  stmt(BPF_RET | BPF_K, SECCOMP_RET_ERRNO | (EPERM & 0xffff)),
                  stmt(BPF_RET | BPF_K, SECCOMP_RET_ALLOW),
              ])
              buf = (ctypes.c_char * len(prog)).from_buffer_copy(prog)
              class sock_fprog(ctypes.Structure):
                  _fields_ = [("len", ctypes.c_ushort), ("filter", ctypes.c_void_p)]
              fp = sock_fprog(len(prog) // 8, ctypes.cast(buf, ctypes.c_void_p))
              NR_seccomp = 317
              SECCOMP_SET_MODE_FILTER = 1
              if libc.syscall(NR_seccomp, SECCOMP_SET_MODE_FILTER, 0, ctypes.byref(fp)) != 0:
                  os._exit(3)
              ctypes.set_errno(0)
              libc.getpriority(0, 0)
              os._exit(10 if ctypes.get_errno() == EPERM else 11)
          pid = os.fork()
          if pid == 0:
              child()
          _, status = os.waitpid(pid, 0)
          code = os.waitstatus_to_exitcode(status)
          if code != 10:
              print(f"::error::seccomp filter did not deny the chosen syscall with EPERM (child exit {code})")
              sys.exit(1)
          print("seccomp capability proven: filter installed, chosen syscall denied with EPERM")
          PY

      - name: Confinement acceptance matrix
        run: cargo test -p o7-worker --locked --test sandbox_confinement -- --include-ignored
