schema: oracle-v0
case: case-0003-interface-dispatch
language: typescript
oracle_kind: constructed
universe: fixture_closed_world

independent_oracle:
  available: true
  tool: TypeScript language service (getImplementationAtPosition, findReferences)
  note: >
    The oracle establishes the implementor set exactly, within this fixture's
    closed world. It does NOT establish which implementor a given call reaches
    -- no sound static analysis can, and that is the point of the case.

adversarial_about: >
  One interface member, two implementors, and a real call chain that reaches the
  member through a factory keyed on a runtime string: run -> settle(selectSink(mode))
  -> sink.accept(). The correct static answer is an over-approximation, and the
  honest static answer says so. This case is therefore not primarily a
  correctness test: it is the corpus's main honesty test, because the only way
  to pass it is to return a reachable-set and decline to call it exhaustive.

seeds:
  - id: seed-ledger-accept
    gold_identity:
      path: source/adapters/ledger-sink.ts
      symbol: LedgerSink.accept
      line_range: [4, 6]
  - id: seed-sink-accept
    gold_identity:
      path: source/ports/payment-sink.ts
      symbol: PaymentSink.accept
      line_range: [2, 2]

facts:
  - seed: seed-sink-accept
    relation: implementations
    expected:
      - path: source/adapters/ledger-sink.ts
        symbol: LedgerSink.accept
        line: 4
      - path: source/adapters/audit-sink.ts
        symbol: AuditSink.accept
        line: 4
    forbidden: []
    admissibility:
      may_claim_complete: true
      may_claim_safe_to_rename: false
      required_caveats: []
      note: >
        Completeness is claimed against `universe: fixture_closed_world` only.
        TypeScript is structurally typed: a class assignable to PaymentSink need
        not declare `implements`, so the interface declaration alone does not
        bound the implementor set in the open world. Within this fixture it
        does, and that is the scope of the claim.

        Rename is unsafe even so: renaming the interface member without both
        implementors in the same edit breaks the contract. Completeness of a
        relation does not imply safety of an action derived from it -- this
        pairing is deliberate.

  - seed: seed-ledger-accept
    relation: callers
    expected:
      - path: source/app/settle.ts
        symbol: settle
        line: 9
        reason: >
          reachable through the interface; a sound over-approximation must
          include this site even though the receiver's declared type is the
          interface, not LedgerSink
    forbidden: []
    admissibility:
      may_claim_complete: false
      may_claim_safe_to_rename: false
      required_caveats: [dynamic_dispatch]
      note: >
        `settle` is not exported and its only caller is `run`, which obtains the
        receiver from `selectSink(mode)`. Whether LedgerSink.accept is reached
        therefore depends on the runtime value of `mode`, and the dependence is
        realised by an actual call chain in the fixture rather than asserted in
        a comment. Any exhaustiveness claim here is false regardless of the edge
        set returned -- including on an edge set that matches `expected`
        exactly. This is the one case in the package where a fully correct
        answer can still be a false-safe.
