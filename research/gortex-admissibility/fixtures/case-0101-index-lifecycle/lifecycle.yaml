schema: lifecycle-v0
case: case-0101-index-lifecycle
language: typescript
universe: fixture_closed_world

entity:
  path: source/repo-main/src/core/rates.ts
  symbol: RateTable.lookup
  line_range: [2, 4]

observation:
  relation: callers
  taken_at_state: s0-fresh
  expected:
    - path: source/repo-main/src/app/quote.ts
      symbol: quote
      line: 4

states:
  - id: s0-fresh
    mutation: null
    description: >
      Committed tree, indexed as-is. The consumer queries callers of
      RateTable.lookup and is handed the observation above. Everything that
      follows is scored against that answer rather than against a re-query.
    graph_current:
      entity_present: true
      expected:
        - path: source/repo-main/src/app/quote.ts
          symbol: quote
          line: 4
      forbidden: []
    questions:
      graph_current_correct: true
      stale_signal_required: false
      old_observation_valid: true
      action_admissible: true

  - id: s1-file-modified
    mutation: tools/mutate.py apply s1-file-modified
    description: >
      quote.ts gains a second function that also calls RateTable.lookup. The
      entity's own file is untouched -- only a file that references it changes.
    graph_current:
      entity_present: true
      expected:
        - path: source/repo-main/src/app/quote.ts
          symbol: quote
          line: 4
        - path: source/repo-main/src/app/quote.ts
          symbol: quoteBulk
          line: 8
      forbidden: []
    questions:
      graph_current_correct: true
      stale_signal_required: true
      old_observation_valid: false
      action_admissible: false
      note: >
        The sharpest of the four states, because the old observation is not
        contradicted -- it is merely short. `quote` is still a caller, so a
        consumer re-reading its cached answer sees nothing wrong. A rename
        driven by it edits one of two sites and compiles on neither reading
        being obviously false. This is where Q2 and Q1 come apart most visibly:
        an index that converges on the new state in milliseconds and says
        nothing to the holder of the old answer has passed Q1 and failed the
        case.

  - id: s2-symbol-deleted
    mutation: tools/mutate.py apply s2-symbol-deleted
    description: >
      RateTable.lookup is removed along with its call site. The tree stays
      valid; the entity simply no longer exists.
    graph_current:
      entity_present: false
    questions:
      graph_current_correct: true
      stale_signal_required: true
      old_observation_valid: false
      action_admissible: false
      note: >
        The old observation now names a symbol that is gone. Q1 is easy here --
        any reindex notices a deleted declaration. Q3 and Q4 are the test: an
        agent still holding "callers of RateTable.lookup = {quote}" must not be
        able to act on it, and a system that answers a query about the deleted
        symbol from a warm cache without marking the answer stale fails Q4 while
        passing Q1.

  - id: s3a-file-removed
    mutation: tools/mutate.py apply s3a-file-removed
    description: >
      core/rates.ts disappears entirely, leaving quote.ts importing a file that
      is no longer there. The world is now inconsistent, which is exactly the
      state a half-finished refactor or an interrupted checkout produces.
    graph_current:
      entity_present: false
    questions:
      graph_current_correct: true
      stale_signal_required: true
      old_observation_valid: false
      action_admissible: false
      note: >
        Distinct from s2: there the symbol was removed cleanly, here the
        definition vanished under a live reference. A tool may reasonably report
        the import as unresolved. What it may not do is keep serving the old
        caller edge as though the definition were still indexed.

  - id: s3b-repo-removed
    mutation: tools/mutate.py apply s3b-repo-removed
    description: >
      The whole repo-main root disappears -- the coarser granularity of the same
      state. Included because a workspace losing a repository is a different code
      path in most indexers than a workspace losing a file, and because it is the
      cheapest way to check that disappearance is handled at all levels rather
      than only at the one the file-level test happens to exercise.
    graph_current:
      entity_present: false
    questions:
      graph_current_correct: true
      stale_signal_required: true
      old_observation_valid: false
      action_admissible: false
      note: >
        Terminal state. If any query still answers from the index here, the
        answer is drawn entirely from memory of a world that is gone. Serving it
        without a staleness marker is the clearest possible Q4 failure, and is
        the one state where a false-safe cannot be argued to be a race.
