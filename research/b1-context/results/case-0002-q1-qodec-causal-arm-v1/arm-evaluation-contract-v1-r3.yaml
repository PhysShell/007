contract_input_consistency_gates:
- id: gate-01
  description: 1 contract fixture_id == gold/manifest/registry/report fixture_id
- id: gate-02
  description: 2 contract registry filename+digest == selected registry
- id: gate-03
  description: 3 contract task IDs == registry task IDs (exact set)
- id: gate-04
  description: 4 each contract questions filename + BOTH digest identities == registered questions file
- id: gate-05
  description: 5 every question ID named by a contract requirement exists in that task's questions file
- id: gate-06
  description: 6 every legacy required_relation_paths entry is expanded by >=1 matching explicit v1 relation requirement
- id: gate-07
  description: 7 no explicit v1 relation requirement lacks a corresponding question-level relation requirement
- id: gate-08
  description: 8 every forbidden_stale_as_current set == the question entry after canonical set normalization
- id: gate-09
  description: 9 every gold_derived_target recomputed from the frozen gold graph == the contract exactly
- id: gate-10
  description: 10 every declared target_status == the gold observation status
- id: gate-11
  description: 11 unknown task/question/observation/relation-kind/endpoint-policy/direction/depth/shape fails closed
task_dependence:
  all_unordered_pairs: true
  pair_expectations:
  - left: case-0002-resume-product-integration
    right: case-0002-audit-r21-evidence-provenance
    expected_shape: incomparable
    rationale: product-resumption and evidence-audit intents require different, non-nested state
  - left: case-0002-audit-r21-evidence-provenance
    right: case-0002-assess-change-impact-on-oracle-topology
    expected_shape: left_strict_superset
    rationale: audit includes the oracle-impact core plus supersession/audit material
  - left: case-0002-resume-product-integration
    right: case-0002-assess-change-impact-on-oracle-topology
    expected_shape: incomparable
    rationale: product state and oracle-impact analysis are distinct, non-nested intents
  not_frozen: exact selected IDs, exact counts and exact symmetric differences are NOT frozen
shape_semantics:
  incomparable: selected sets differ, neither set is a subset of the other, and BOTH directional differences are non-empty
  left_strict_superset: left contains every right item and at least one additional item
  unknown_shape: fail closed
evaluator_implementation_identity:
  manifest_schema: o7.b1.evaluator-implementation-manifest/v0
  manifest_digest_field: evaluator_implementation_manifest_digest (canonical_object_sha256 of the manifest)
  output_must_record:
    evaluator_entrypoint_sha256: required
    evaluator_module_sha256: required
    execution_checkout_commit: required
    execution_checkout_tree: required
  note: CLI + module both belong to the implementation closure.
outcome_axes:
- contract_input_consistency
- source_compilation
- projection_validity
- question_observation_support
- relation_support
- stale_state_safety
- task_dependence
- negative_control_diagnostics
axis_requirements:
  contract_input_consistency: required
  source_compilation: required
  projection_validity: required
  question_observation_support: required
  relation_support: required
  stale_state_safety: required
  task_dependence: required
  negative_control_diagnostics: optional
overall_rules:
  any_required_axis_FAIL: overall FAIL
  any_required_axis_UNAVAILABLE_without_FAIL: overall UNAVAILABLE
  all_required_axes_PASS: overall PASS (regardless of an optional NOT_APPLICABLE)
  optional_diagnostics_cannot_upgrade_or_downgrade_required_gates: true
  PARTIAL: forbidden in evaluation v1
semantic_revision_from_r2: false
validation_revision: true
supersedes_contract_revision: 2
