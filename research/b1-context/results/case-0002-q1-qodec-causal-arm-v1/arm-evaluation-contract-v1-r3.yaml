full_derived_semantics: full_derived is NOT a compiled-observation arm. Evaluation v1 must not infer semantic answerability
  from raw transcript text and must not award compiled-observation/relation/stale-state/projection-validity support to it.
  Those task-level structural gates apply to the projection arm only.
source_compilation_requirements_full_derived:
- session_matches_derived_manifest
- derived_body_available
- derived_byte_length_and_sha256_match
- record_count_reproducible
- extractor_identity_and_raw_binding_present
source_compilation_note: Verifies FROZEN derived artifacts; does NOT rerun extraction and does NOT judge transcript semantics.
