    definition: Sum over every selected observation in canonical selector order of len(canonical_json_bytes(observation))
      + 1 (LF). record_count = number of selected observations. This preserves selector-v0 gating semantics.
    gating: true
  diagnostics:
    rendered_context_json_bytes:
