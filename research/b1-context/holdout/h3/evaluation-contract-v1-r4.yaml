task_dependence:
  all_unordered_pairs: true
  pair_expectations:
  - left: holdout-h3-load
    right: holdout-h3-meta
    expected_shape: incomparable
    rationale: holdout
  not_frozen: holdout
  gating: false
  status: diagnostic
  non_normative_statement: A projection-validity verdict may not depend on incidental membership of optional, semantically
    admissible records unless the contract independently declares that membership normative. Selected-set topology is therefore
    not a gating oracle.
  retirement_rationale:
    classification: TASK_DEPENDENCE_RETIRED_AS_NON_NORMATIVE_SHAPE_METRIC
    why: 'Under rev3 the axis gated on whether two tasks'' selected sets stood in a contract-pinned relationship. That relationship
      is a property of the projector''s realization, not of the tasks'' obligations: a valid projection whose relation-aware
      closure legitimately admits an optional record can change the shape without violating anything the contract declares
      mandatory.'
    search_for_a_replacement: Every candidate predicate examined either failed metamorphic projection-invariance over mutations
      the contract does not declare mandatory, or collapsed into an axis that already owns the property.
    ownership_after_retirement:
      task obligations (required observations): question_observation_support
      required relation witnesses: relation_support
      stale material presented as current: stale_state_safety
      eligibility, admissibility and budget/cost: projection_validity
    future_reopening: Projection topology may become normative again only if a future contract supplies an independent normative
      selection or minimality objective. Until then it is descriptive.
  reported_topology_values:
  - equal
  - left_strict_superset
  - right_strict_superset
  - incomparable
  pair_expectations_are_historical_only: true
shape_semantics:
  incomparable: sets differ, neither subset
  left_strict_superset: left contains every right item plus more
  unknown_shape: fail closed
