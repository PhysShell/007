task_dependence:
  all_unordered_pairs: true
  pair_expectations:
    resume__audit:
      expected_shape: materially_different
      rationale: product-resumption and evidence-audit intents require different state
    audit__impact:
      expected_shape: left_strict_superset
      left: case-0002-audit-r21-evidence-provenance
      right: case-0002-assess-change-impact-on-oracle-topology
      rationale: audit includes the oracle-impact core plus supersession/audit material
    resume__impact:
      expected_shape: materially_different
      rationale: product state and oracle-impact analysis are distinct intents
  not_frozen: exact selected IDs, exact counts and exact symmetric differences are NOT frozen (intent-level
    shapes only)
shape_semantics:
  materially_different: selected sets differ and are not equal
  left_strict_superset: left contains every right item and at least one additional item
  unknown_shape: fail closed
outcome_axes:
- source_compilation
- projection_validity
- question_observation_support
- relation_support
- stale_state_safety
- task_dependence
- negative_control_diagnostics
overall_rules:
  PASS: every required family applicable and passes
  FAIL: at least one applicable required gate fails
  UNAVAILABLE: a required input or arm cannot be constructed
  absent_optional_negative_control_does_not_prevent_PASS: true
  optional_diagnostics_cannot_upgrade_a_failing_required_gate: true
  generation_success_is_separate_from_evaluation_PASS: true
  PARTIAL: NOT used in evaluation v1 (preserved only as a legacy report-v1 field)
