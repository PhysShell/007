        - reconstruction receipt precedes the first RAW-capture event
          observed in the session C transcript
      does_not_establish:
        - absence of unrecorded RAW access
        - absence of access through external channels
      independence: same_platform_not_independent
      note: >
        A platform export of session C can corroborate transcript content
        and ordering (not the container snapshot's exact bytes — it is a
        separate capture path) but remains same-platform evidence. Global absence of
        access is not establishable without a confined-environment
        experiment or external attestation — and is not required for a
        negative control: producer claimed no access, the captured
        session-C transcript (interim snapshot) shows no prior access,
        global absence not established.
    known_divergence_already_observed: >
      Reconstruction assumed working labels B and D were two separate
      conversations and did not know session E existed as a distinct chat.
      The reconstruction receipt precedes the first RAW-capture event
      observed in the captured session-C transcript; the producer's
      global no-access statement remains advisory. Divergence is
      measurement data, not an error to fix.

