schema: o7.b1.questions/v0
fixture_id: case-0001
# Frozen and digest-bound BEFORE projection/evaluation. Each question names the
# observation IDs that a faithful answer must be supported by. These expected IDs
# are the recall target for every evaluation arm. (case-0001 is a development
# fixture: questions written against its own material debug the representation;
# per holdout/README.md they cannot substantiate generalization.)
questions:
  - id: q1-hypothesis
    text: What is the exact B1 hypothesis?
    required_observation_ids: [obs-b1-hypothesis]
  - id: q2-authority-boundaries
    text: What are B1's authority boundaries?
    required_observation_ids: [obs-b1-readonly-boundary, obs-b1-independent-a-series]
  - id: q3-source-set-status
    text: What is the current source-set status and why is it not complete?
    required_observation_ids:
      [obs-source-set-status-interim, obs-source-set-not-complete-conditions, obs-account-export-pending]
  - id: q4-source-classes
    text: Which source classes exist and which are authoritative vs advisory?
    required_observation_ids: [obs-source-classes-authority, obs-negative-control-advisory]
  - id: q5-session-topology
    text: What is the actual session topology after capture?
    required_observation_ids: [obs-bd-one-conversation, obs-session-e-separate]
  - id: q6-snapshot-relation
    text: How do session C snapshot-1 and snapshot-2 relate?
    required_observation_ids: [obs-snapshot2-supersedes-1, obs-byte-prefix-scope]
  - id: q7-negative-control-divergence
    text: Which negative-control claims turned out wrong or incomplete?
    required_observation_ids: [obs-nc-divergence-bd, obs-nc-divergence-e]
  - id: q8-next-step
    text: What is the next allowed step?
    required_observation_ids: [obs-next-step-extractors-schema]
  - id: q9-forbidden
    text: Which actions or claims are forbidden right now?
    required_observation_ids: [obs-b1-readonly-boundary, obs-holdout-no-generalization]
  - id: q10-pending-vs-blocking
    text: Which pending items actually block generalization but not the development run?
    required_observation_ids: [obs-account-export-pending, obs-holdout-no-generalization]
